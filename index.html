<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বিয়ের বায়োডাটা মেকার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --accent: #8b1e3f; --line: #d9c7b0; --ink: #222; --bg: #faf6f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans Bengali", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--accent); color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
  .wrap { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 20px; padding: 20px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; align-self: start; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; font-size: 14px; }
  textarea { min-height: 60px; resize: vertical; }
  h3 { margin: 18px 0 2px; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .note { font-size: 12px; color: #666; margin-top: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; font: inherit; cursor: pointer; }
  button.alt { background: #666; }
  #status { font-size: 12px; color: #2a7; margin-top: 8px; min-height: 16px; }

  /* ---------- প্রিভিউ (A4) : সাধারণ ভিত্তি ---------- */
  .sheet { background: #fff; width: 100%; max-width: 210mm; margin: 0 auto; min-height: 297mm; padding: 14mm 16mm; border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.08); font-size: 13px; line-height: 1.6; position: relative; }
  .sheet h2 { text-align: center; margin: 0 0 12px; font-size: 20px; }
  .sheet .photo { float: right; width: 110px; height: 140px; border: 1px solid #aaa; object-fit: cover; margin: 0 0 10px 12px; }
  .sheet table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
  .sheet td { padding: 3px 6px; vertical-align: top; }
  .sheet td.k { width: 36%; font-weight: 600; }
  .sheet h4 { margin: 14px 0 4px; font-size: 14px; padding-bottom: 2px; }
  .sheet p { margin: 4px 0 8px; }
  .sheet .clear { clear: both; }

  /* ১. ক্লাসিক */
  .t-classic { border: 6px double #8b1e3f; }
  .t-classic h2 { color: #8b1e3f; border-bottom: 1px solid #d9c7b0; padding-bottom: 8px; }
  .t-classic h4 { color: #8b1e3f; border-bottom: 1px solid #d9c7b0; }

  /* ২. সাদামাটা */
  .t-simple { border: 0; box-shadow: none; }
  .t-simple h2 { color: #000; border-bottom: 2px solid #000; padding-bottom: 6px; }
  .t-simple h4 { color: #000; border-bottom: 0; text-transform: none; }
  .t-simple .photo { border: 0; }

  /* ৩. ইসলামি (সবুজ-সোনালি) */
  .t-islamic { background: #fffdf5; border: 3px solid #1f5c3f; outline: 1px solid #c9a227; outline-offset: -12px; }
  .t-islamic h2 { color: #1f5c3f; font-size: 22px; padding-bottom: 8px; border-bottom: 2px solid #c9a227; margin-top: 10px; }
  .t-islamic h2::before, .t-islamic h2::after { content: "✦"; color: #c9a227; margin: 0 10px; }
  .t-islamic h4 { color: #1f5c3f; border-bottom: 1px dashed #c9a227; }
  .t-islamic h4::before { content: "✦ "; color: #c9a227; }
  .t-islamic td.k { color: #1f5c3f; }

  /* ৪. এলিগ্যান্ট (সোনালি সিরিফ) */
  .t-elegant { font-family: "Noto Serif Bengali", Georgia, serif; border: 1px solid #b08d57; outline: 1px solid #b08d57; outline-offset: 6px; }
  .t-elegant h2 { color: #6b4f1d; letter-spacing: 2px; font-size: 22px; margin-top: 14px; }
  .t-elegant h4 { color: #6b4f1d; text-align: center; letter-spacing: 1px; border-bottom: 1px solid #b08d57; width: 60%; margin-left: auto; margin-right: auto; }
  .t-elegant td.k { color: #6b4f1d; }

  /* ৫. মিনিমাল (সাদা-ধূসর, সরল) */
  .t-minimal { border: 0; box-shadow: none; color: #333; }
  .t-minimal h2 { text-align: left; font-size: 16px; text-transform: uppercase; letter-spacing: 3px; color: #555; margin-bottom: 20px; }
  .t-minimal h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #888; border-bottom: 0; margin-top: 22px; }
  .t-minimal td { padding: 2px 0; }
  .t-minimal td.k { color: #777; font-weight: 400; }
  .t-minimal .photo { border: 0; }

  /* ৬. ফুলেল (গোলাপি, গোলাকার) */
  .t-floral { background: #fff5f7; border: 2px solid #e8a0b4; border-radius: 22px; }
  .t-floral h2 { color: #b23a5e; font-size: 22px; }
  .t-floral h2::before { content: "❀ "; color: #e8a0b4; }
  .t-floral h2::after { content: " ❀"; color: #e8a0b4; }
  .t-floral h4 { display: inline-block; background: #b23a5e; color: #fff; border-radius: 20px; padding: 2px 14px; border-bottom: 0; }
  .t-floral td.k { color: #b23a5e; }
  .t-floral .photo { border-radius: 14px; border: 3px solid #fff; box-shadow: 0 0 0 2px #e8a0b4; }

  /* ৭. রয়্যাল (নেভি-সোনা ব্যান্ড) */
  .t-royal { border: 0; box-shadow: 0 0 0 1px #1d2d50; }
  .t-royal .band, .t-royal h2 { background: #1d2d50; color: #f1d27a; margin: -14mm -16mm 16px; padding: 14mm 16mm 8mm; }
  .t-royal h2 { font-size: 22px; letter-spacing: 1px; margin-bottom: 16px; }
  .t-royal h4 { color: #1d2d50; border-bottom: 2px solid #f1d27a; }
  .t-royal .photo { margin-top: 0; }

  /* ৮. সবুজ ব্যান্ড (তাজা, আধুনিক) */
  .t-green { border: 0; box-shadow: 0 0 0 1px #2e7d4f; }
  .t-green h2 { background: #2e7d4f; color: #fff; margin: -14mm -16mm 16px; padding: 14mm 16mm 8mm; font-size: 22px; }
  .t-green h4 { color: #2e7d4f; border-bottom: 3px solid #2e7d4f; padding-bottom: 3px; width: 100%; }
  .t-green td.k { color: #2e7d4f; }

  /* ৯. কার্ড (ছোট বক্সে সাজানো) */
  .t-card { background: #eef2f8; border: 0; box-shadow: none; }
  .t-card h2 { color: #2b3a67; font-size: 22px; }
  .t-card h4 { background: #fff; color: #2b3a67; padding: 6px 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 14px 0 6px; border-bottom: 0; }
  .t-card table, .t-card p { background: #fff; border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .t-card .photo { border-radius: 10px; }

  /* ১০. ডার্ক হেডার (কালো-ধূসর) */
  .t-dark { border: 0; box-shadow: 0 0 0 1px #222; }
  .t-dark h2 { background: #222; color: #fff; margin: -14mm -16mm 18px; padding: 14mm 16mm 8mm; text-transform: uppercase; letter-spacing: 3px; font-size: 20px; }
  .t-dark h4 { text-transform: uppercase; letter-spacing: 2px; font-size: 12px; color: #222; border-bottom: 1px solid #222; }
  .t-dark td.k { color: #444; }

  /* ১১. ঐতিহ্যবাহী (ক্রিম-লাল ফ্রেম) */
  .t-traditional { background: #fdf3e1; border: 3px solid #b3261e; border-radius: 4px; outline: 1px solid #b3261e; outline-offset: 6px; }
  .t-traditional h2 { color: #b3261e; font-size: 22px; border-top: 1px solid #b3261e; border-bottom: 1px solid #b3261e; padding: 6px 0; margin-top: 10px; }
  .t-traditional h4 { color: #b3261e; border-bottom: 1px dotted #b3261e; }
  .t-traditional td.k { color: #7a1510; }

  /* ১২. গ্রেডিয়েন্ট (বেগুনি-গোলাপি) */
  .t-gradient { border: 0; box-shadow: 0 0 0 1px #c4a7e7; }
  .t-gradient h2 { background: linear-gradient(90deg, #6a3fb5, #d4488a); color: #fff; margin: -14mm -16mm 16px; padding: 14mm 16mm 8mm; font-size: 22px; }
  .t-gradient h4 { background: linear-gradient(90deg, #6a3fb5, #d4488a); -webkit-background-clip: text; background-clip: text; color: transparent; border-bottom: 2px solid #d4488a; font-size: 15px; }
  .t-gradient td.k { color: #6a3fb5; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    header, .no-print { display: none !important; }
    .wrap { display: block; padding: 0; max-width: none; }
    .sheet { box-shadow: none; max-width: none; }
  }
</style>
</head>
<body>
<header>
  <h1>বিয়ের বায়োডাটা মেকার</h1>
  <p>আপনার তথ্য শুধু এই browser-এ সংরক্ষিত হয়, কোথাও পাঠানো হয় না।</p>
</header>

<div class="wrap">
  <div class="panel no-print">
    <label>টেমপ্লেট</label>
    <select id="template">
      <option value="classic">১. ক্লাসিক (বর্ডারসহ)</option>
      <option value="simple">২. সাদামাটা</option>
      <option value="islamic">৩. ইসলামি (সবুজ-সোনালি)</option>
      <option value="elegant">৪. এলিগ্যান্ট (সোনালি)</option>
      <option value="minimal">৫. মিনিমাল</option>
      <option value="floral">৬. ফুলেল (গোলাপি)</option>
      <option value="royal">৭. রয়্যাল (নেভি-সোনা)</option>
      <option value="green">৮. সবুজ ব্যান্ড</option>
      <option value="card">৯. কার্ড</option>
      <option value="dark">১০. ডার্ক হেডার</option>
      <option value="traditional">১১. ঐতিহ্যবাহী (ক্রিম-লাল)</option>
      <option value="gradient">১২. গ্রেডিয়েন্ট</option>
    </select>

    <h3>ব্যক্তিগত তথ্য</h3>
    <label>নাম</label><input data-f="name">
    <label>পিতার নাম</label><input data-f="father">
    <label>মাতার নাম</label><input data-f="mother">
    <label>জন্ম তারিখ</label><input data-f="dob" placeholder="যেমন: ১ জানুয়ারি ১৯৯৫">
    <label>উচ্চতা</label><input data-f="height" placeholder="যেমন: ৫ ফুট ৬ ইঞ্চি">
    <label>গায়ের রং</label><input data-f="complexion">
    <label>ধর্ম</label><input data-f="religion">
    <label>বৈবাহিক অবস্থা</label><input data-f="marital" placeholder="যেমন: অবিবাহিত">
    <label>রক্তের গ্রুপ (ঐচ্ছিক)</label><input data-f="blood">

    <h3>শিক্ষা ও পেশা</h3>
    <label>সর্বোচ্চ শিক্ষা</label><input data-f="education" placeholder="যেমন: স্নাতকোত্তর, ঢাকা বিশ্ববিদ্যালয়">
    <label>পেশা / কর্মস্থল</label><input data-f="occupation">
    <label>আয় (ঐচ্ছিক)</label><input data-f="income">

    <h3>ঠিকানা ও যোগাযোগ</h3>
    <label>স্থায়ী ঠিকানা</label><textarea data-f="address"></textarea>
    <label>মোবাইল নম্বর</label><input data-f="phone">
    <label>ইমেইল (ঐচ্ছিক)</label><input data-f="email">

    <h3>পারিবারিক তথ্য</h3>
    <label>পরিবারের বিবরণ</label><textarea data-f="family" placeholder="যেমন: ভাই-বোন, পিতার পেশা, পরিবারের পরিবেশ"></textarea>

    <h3>পছন্দ ও প্রত্যাশা</h3>
    <label>পাত্রী / পাত্রের প্রত্যাশা</label><textarea data-f="expect"></textarea>
    <label>আমার সম্পর্কে</label><textarea data-f="about"></textarea>

    <h3>ছবি (ঐচ্ছিক)</h3>
    <input type="file" id="photo" accept="image/*">
    <p class="note">ছবি শুধু এই পেজেই দেখানো হয়। কোথাও আপলোড হয় না।</p>

    <div class="btns">
      <button id="printBtn">প্রিন্ট / PDF</button>
      <button class="alt" id="resetBtn">সব মুছুন</button>
    </div>
    <div id="status"></div>
    <p class="note">প্রিন্ট ডায়ালগে "Save as PDF" বেছে নিলে PDF হবে।</p>
  </div>

  <div id="preview" class="sheet t-classic"></div>
</div>

<script>
const KEY = "biodata-v1";
const LABELS = {
  dob:"জন্ম তারিখ", height:"উচ্চতা", complexion:"গায়ের রং", religion:"ধর্ম", marital:"বৈবাহিক অবস্থা",
  blood:"রক্তের গ্রুপ", education:"সর্বোচ্চ শিক্ষা", occupation:"পেশা", income:"আয়",
  address:"স্থায়ী ঠিকানা", phone:"মোবাইল", email:"ইমেইল", father:"পিতার নাম", mother:"মাতার নাম"
};
let photoData = "";
const data = {};
const templateSel = document.getElementById("template");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function readForm() {
  document.querySelectorAll("[data-f]").forEach(el => data[el.dataset.f] = el.value);
}

function save() {
  readForm();
  try {
    localStorage.setItem(KEY, JSON.stringify({ data, photoData, template: templateSel.value }));
    flash("সংরক্ষিত হয়েছে");
  } catch (e) { flash("সংরক্ষণ করা যায়নি"); }
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!saved) return;
    Object.assign(data, saved.data || {});
    photoData = saved.photoData || "";
    if (saved.template) templateSel.value = saved.template;
    document.querySelectorAll("[data-f]").forEach(el => el.value = data[el.dataset.f] || "");
  } catch (e) {}
}

let flashTimer;
function flash(msg) {
  const s = document.getElementById("status");
  s.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => s.textContent = "", 1500);
}

function row(label, value) {
  if (!value || !String(value).trim()) return "";
  return `<tr><td class="k">${esc(label)}</td><td>: ${esc(value)}</td></tr>`;
}

function render() {
  const d = data;
  const sheet = document.getElementById("preview");
  sheet.className = "sheet t-" + templateSel.value;

  const photo = photoData ? `<img class="photo" src="${photoData}" alt="ছবি">` : "";
  const personal = ["dob","height","complexion","religion","marital","blood"].map(k => row(LABELS[k], d[k])).join("");
  const edu = ["education","occupation","income"].map(k => row(LABELS[k], d[k])).join("");
  const contact = ["address","phone","email"].map(k => row(LABELS[k], d[k])).join("");
  const parents = row(LABELS.father, d.father) + row(LABELS.mother, d.mother);

  // ফাঁকা অংশের শিরোনাম যেন না দেখায়
  const section = (title, body) => body.replace(/<[^>]+>/g, "").trim() ? `<h4>${esc(title)}</h4>` + body : "";
  const para = t => t ? `<p>${esc(t).replace(/\n/g,"<br>")}</p>` : "";

  sheet.innerHTML = `
    <h2>বিয়ের বায়োডাটা</h2>
    ${photo}
    <table>
      ${row("নাম", d.name)}
      ${parents}
    </table>
    ${section("ব্যক্তিগত তথ্য", `<table>${personal}</table>`)}
    ${section("শিক্ষা ও পেশা", `<table>${edu}</table>`)}
    ${section("যোগাযোগ", `<table>${contact}</table>`)}
    ${section("পারিবারিক তথ্য", para(d.family))}
    ${section("আমার সম্পর্কে", para(d.about))}
    ${section("পাত্রী / পাত্রের প্রত্যাশা", para(d.expect))}
    <div class="clear"></div>
  `;
}

document.querySelectorAll("[data-f]").forEach(el => {
  el.addEventListener("input", () => { readForm(); render(); save(); });
});
templateSel.addEventListener("change", () => { render(); save(); });

document.getElementById("photo").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { photoData = reader.result; render(); save(); };
  reader.readAsDataURL(file);
});

document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("সব তথ্য মুছে ফেলতে চান?")) return;
  localStorage.removeItem(KEY);
  document.querySelectorAll("[data-f]").forEach(el => el.value = "");
  photoData = "";
  document.getElementById("photo").value = "";
  readForm();
  render();
  flash("মুছে ফেলা হয়েছে");
});

load();
render();
</script>
</body>
</html>
